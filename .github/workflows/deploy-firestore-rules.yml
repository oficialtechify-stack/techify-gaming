name: Firestore rules safety check

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
      - 'scripts/publish-firestore-preview.mjs'
      - '.github/workflows/deploy-firestore-rules.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify production publisher is wired
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const build = String(pkg.scripts?.build || '');
          if (!build.includes('scripts/publish-firestore-preview.mjs')) {
            throw new Error('O build de produção não chama o publicador de regras do Firestore.');
          }
          const publisher = fs.readFileSync('scripts/publish-firestore-preview.mjs', 'utf8');
          if (!publisher.includes("VERCEL_ENV === 'production'") || !publisher.includes("PRODUCTION_BRANCH = 'main'")) {
            throw new Error('O publicador do Firestore não está protegido para produção/main.');
          }
          if (!publisher.includes('firebaserules.googleapis.com')) {
            throw new Error('Publicador de Security Rules não encontrado.');
          }
          console.log('OK: o deploy real das regras é executado pelo build Production da Vercel.');
          NODE

      - name: Explain deployment path
        run: |
          echo "Security Rules são publicadas dentro do npm run build na Vercel Production."
          echo "As credenciais Firebase permanecem somente no ambiente protegido da Vercel."
