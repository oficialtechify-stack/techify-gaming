name: Production Readiness

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - fix/production-payment-safety

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: npm run lint

      - name: Validate LeadsPay Office maps
        run: npm run validate:office-world

      - name: Unit tests
        run: node --import tsx --test lib/*.test.ts

      - name: Production build
        run: npm run build
