name: Deploy production to Vercel
# Office asset-proxy deployment trigger: 2026-10-07

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-vercel-production.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_NbEe7FyvVyYANMVHDoJVfaAL
      VERCEL_PROJECT_ID: prj_1gaBGjVLeja0aMLkzYz7oXMO8qQq
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout final code
        uses: actions/checkout@v4

      - name: Verify Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN_NOT_CONFIGURED"
            exit 1
          fi

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Pull production configuration
        run: npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production locally in GitHub Actions
        run: npx vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        run: npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
