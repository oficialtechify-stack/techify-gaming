name: Firebase Production Deploy Gate

on:
  push:
    branches:
      - fix/production-payment-safety

jobs:
  deploy-firestore:
    if: contains(github.event.head_commit.message, '[deploy-firebase]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Firebase deploy credential
        env:
          FIREBASE_CREDENTIAL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        run: |
          if [ -z "$FIREBASE_CREDENTIAL" ]; then
            echo "::error::No Firebase deploy service-account secret is configured in GitHub."
            exit 1
          fi

      - id: auth
        name: Authenticate Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}

      - name: Deploy Firestore rules and indexes
        run: npx -y firebase-tools@14.23.1 deploy --only firestore:rules,firestore:indexes --project techify-gaming-106fe --non-interactive
