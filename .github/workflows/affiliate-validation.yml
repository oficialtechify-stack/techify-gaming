name: Affiliate validation (no deployment)
on:
  push:
    branches:
      - chore/firestore-scale-cleanup
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: TypeScript check
        run: npm run lint
      - name: Unit tests
        run: node --import tsx --test lib/*.test.ts
