name: Affiliate validation (no deployment)
on:
  push:
    branches:
      - chore/firestore-scale-cleanup
      - release/leadspay-unified-2026-10-14
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: TypeScript check
        run: npm run lint
      - name: Isolated unit tests (no Firebase or Stripe credentials)
        run: |
          mapfile -t files < <(find lib -maxdepth 1 -name '*.test.ts' ! -name 'checkoutPersistence.test.ts' | sort)
          node --import tsx --test "${files[@]}"
      # checkoutPersistence.test.ts needs a Firestore emulator or explicit dependency
      # injection; never run its real-database operations using production credentials.
