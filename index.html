    <!-- Immediate Affiliate Cookie Retention (15 days / 1,296,000s) -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var ref = params.get('ref') || params.get('r');
          if (ref && ref.trim()) {
            var cleanRef = ref.trim();
            document.cookie = "affiliate_ref=" + encodeURIComponent(cleanRef) + "; path=/; max-age=1296000; SameSite=Lax; Secure";
            localStorage.setItem("affiliate_ref", cleanRef);
            localStorage.setItem("leadspay_affiliate_ref", cleanRef);
            localStorage.setItem("techify_affiliate_ref", cleanRef);
          }
        } catch(e) {}
      })();
    </script>
